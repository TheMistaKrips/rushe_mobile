workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 20
      vars:
        BUNDLE_ID: "com.rushe.app"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npx expo install
      
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      
      - name: Fix Podfile
        script: |
          sed -i '' 's/config = use_native_modules!(config_command)/config = use_native_modules!/g' ios/Podfile || true
      
      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      
      - name: Build iOS
        script: |
          npx expo run:ios --configuration Release
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.ipa